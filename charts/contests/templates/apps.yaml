apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: contests
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "contests.labels" . | nindent 4 }}
spec:
  accessPolicy:
    inbound:
      rules:
        - application: {{ .Release.Name }}-blackbox-exporter
  image: "{{ .Values.contests.image.repository }}/{{ .Values.contests.image.name }}:{{ .Chart.Version }}"
  port: 8080
  prometheus:
    enabled: true
  replicas:
    min: 1
    max: 1
  liveness:
    path: /ping
  readiness:
    path: /ping
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi
  env:
    - name: CHECKS
      value: {{ include "contests.checks" . | quote }}
    - name: GOMEMLIMIT
      value: 96MiB
    {{- if .Values.contests.bucket.enabled }}
    - name: BUCKET_NAME
      value: {{ include "contests.bucketName" . | quote }}
    {{- end }}
    {{- if .Values.contests.kafka.enabled }}
    - name: KAFKA_TOPIC
      value: {{ .Release.Namespace }}.contests
    {{- end }}
  {{- if .Values.contests.bucket.enabled }}
  gcp:
    buckets:
      - name: {{ include "contests.bucketName" . | quote }}
  {{- end }}
  {{- if .Values.contests.kafka.enabled }}
  kafka:
    pool: {{ required "contests.kafka.pool is required when Kafka is enabled" .Values.contests.kafka.pool | quote }}
  {{- end }}
  {{- if .Values.contests.valkey.enabled }}
  valkey:
    - instance: contests
      access: readwrite
  {{- end }}
  {{- if .Values.contests.postgres.enabled }}
  uses:
    postgres:
      - name: contests
        role: readwrite
  {{- end }}
{{- if .Values.contests.accessPolicy.enabled }}
---
apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: contests-noaccess
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "contests.labels" . | nindent 4 }}
spec:
  image: "{{ .Values.contests.image.repository }}/{{ .Values.contests.image.name }}:{{ .Chart.Version }}"
  port: 8080
  replicas:
    min: 1
    max: 1
  liveness:
    path: /ping
  readiness:
    path: /ping
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi
  env:
    - name: CHECKS
      value: none
    - name: GOMEMLIMIT
      value: 96MiB
{{- end }}
