{{- if .Values.contests.valkey.enabled }}
apiVersion: nais.io/v1
kind: Valkey
metadata:
  name: contests
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "contests.labels" . | nindent 4 }}
spec:
  tier: SingleNode
  memory: 1GB
  version: "9.1"
  persistence:
    disabled: true
{{- end }}
