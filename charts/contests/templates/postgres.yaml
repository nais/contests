{{ if .Values.contests.postgres.enabled }}
---
apiVersion: nais.io/v1
kind: Postgres
metadata:
  name: contests
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "contests.labels" . | nindent 4 }}
spec:
  majorVersion: "18"
  resources:
    cpu: 100m
    diskSize: 5Gi
    memory: 256Mi
{{ end }}
