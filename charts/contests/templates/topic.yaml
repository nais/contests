{{- if .Values.contests.kafka.enabled }}
apiVersion: kafka.nais.io/v1
kind: Topic
metadata:
  name: contests
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "contests.labels" . | nindent 4 }}
spec:
  acl:
  - access: readwrite
    application: contests
    team: {{ .Release.Namespace }}
  pool: {{ .Values.contests.kafka.pool }}
{{- end }}
