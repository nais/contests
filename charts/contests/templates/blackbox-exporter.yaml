apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-blackbox-exporter
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "contests.labels" . | nindent 4 }}
data:
  config.yml: |
    modules:
      http_2xx:
        prober: http
        timeout: 5s
        http:
          valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
          follow_redirects: true
          preferred_ip_protocol: ip4
          ip_protocol_fallback: false
    {{- if .Values.contests.kafka.enabled }}
      http_kafka:
        prober: http
        timeout: 10s
        http:
          preferred_ip_protocol: ip4
          ip_protocol_fallback: false
    {{- end }}
---
apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: {{ .Release.Name }}-blackbox-exporter
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "contests.labels" . | nindent 4 }}
spec:
  image: prom/blackbox-exporter:v0.29.1
  accessPolicy:
    outbound:
      rules:
        - application: contests
      external:
        - host: dns.google
        - host: 1dot1dot1dot1.cloudflare-dns.com
  filesFrom:
    - configmap: {{ .Release.Name }}-blackbox-exporter
      mountPath: /etc/blackbox_exporter
  port: 9115
  replicas:
    min: 2
    max: 2
  skipCaBundle: true
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-prometheus-to-blackbox-exporter
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "contests.labels" . | nindent 4 }}
spec:
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: nais-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
        - namespaceSelector:
            matchLabels:
              name: nais-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: alloy
  podSelector:
    matchLabels:
      app: {{ .Release.Name }}-blackbox-exporter
  policyTypes:
    - Ingress
---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: {{ .Release.Name }}-probes
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "contests.labels" . | nindent 4 }}
    nais.io/prometheus: nais
spec:
  interval: 60s
  module: http_2xx
  prober:
    url: {{ .Release.Name }}-blackbox-exporter.{{ .Release.Namespace }}:80
  targets:
    staticConfig:
      static:
        - http://contests/ping
        {{- if .Values.contests.accessPolicy.enabled }}
        - http://contests-noaccess/ping
        - https://google.com
        {{- end }}
        - https://dns.google
        - https://1dot1dot1dot1.cloudflare-dns.com
        {{- range .Values.blackboxExporter.additionalTargetURLs }}
        - {{ . | quote }}
        {{- end }}
{{- if .Values.contests.kafka.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: {{ .Release.Name }}-kafka-probe
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "contests.labels" . | nindent 4 }}
    nais.io/prometheus: nais
spec:
  interval: 60s
  scrapeTimeout: 12s
  module: http_kafka
  prober:
    url: {{ .Release.Name }}-blackbox-exporter.{{ .Release.Namespace }}:80
  targets:
    staticConfig:
      static:
        - http://contests/kafka
{{- end }}
