dependencies:
  - allOf:
      - monitoring
      - nais-crds
values:
  contests.kafka.enabled:
    displayName: Enable Kafka connectivity check
    config:
      type: bool
    computed:
      template: '{{ hasKey .Env "kafka_bootstrap_broker" }}'
  contests.kafka.pool:
    displayName: Kafka pool
    computed:
      template: '{{ .Env.aiven_project | quote }}'
  blackboxExporter.additionalTargetURLs:
    displayName: Additional Target URLs
    config:
      type: string_array
