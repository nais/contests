dependencies:
  - allOf:
      - monitoring
      - nais-crds
      - pgrator
values:
  blackboxExporter.additionalTargetURLs:
    displayName: Additional Target URLs
    config:
      type: string_array
  contests.postgres.enabled:
    displayName: Enable Nais Postgres check
    config:
      type: bool
  contests.kafka.enabled:
    displayName: Enable Kafka check
    config:
      type: bool
    computed:
      template: '{{ hasKey .Env "kafka_bootstrap_broker" }}'
  contests.kafka.pool:
    displayName: Kafka pool
    computed:
      template: '{{ .Env.aiven_project | quote }}'
  contests.bucket.enabled:
    displayName: Enable bucket check
    config:
      type: bool
  contests.valkey.enabled:
    displayName: Enable Valkey check
    config:
      type: bool
    computed:
      template: '{{ hasKey .Env "aiven_project" }}'
